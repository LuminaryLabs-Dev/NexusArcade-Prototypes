name: Publish prototype catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexusarcade-prototypes-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate gameplay contracts and JavaScript
        run: |
          node scripts/validate-repo.mjs
          node tests/knockout-circuit-multiplayer.mjs
          node tests/gothic-revolt-save.mjs

      - name: Build prototype catalog
        env:
          NEXUS_ARCADE_REPO_TOKEN: ${{ secrets.NEXUS_ARCADE_REPO_TOKEN }}
        run: node scripts/build-site.mjs

      - name: Verify publish allowlists
        run: |
          test ! -e _site/games/the-long-haul/tests
          test ! -e _site/games/the-long-haul/package.json
          test -f _site/games/the-long-haul/src/app/bootstrap.mjs

      - name: Open every game in Chrome
        run: node tests/browser-smoke.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
