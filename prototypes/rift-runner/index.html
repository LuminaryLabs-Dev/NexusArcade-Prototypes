<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#05030b">
  <title>Rift Runner</title>
  <style>
    :root{--cyan:#56f6ff;--magenta:#ff2acb;--orange:#ff8a27;--ink:#05030b;--panel:rgba(6,8,20,.86)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif;user-select:none}
    canvas{display:block;width:100%;height:100%;cursor:crosshair}
    #vignette,#speed-fx,#grain,#flash{position:fixed;inset:0;pointer-events:none}
    #vignette{background:radial-gradient(ellipse at 50% 44%,transparent 35%,rgba(0,0,0,.78) 115%);z-index:2}
    #speed-fx{z-index:3;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(86,246,255,.15) 0 .18deg,transparent .22deg 5deg);mask-image:radial-gradient(circle,transparent 0 25%,#000 70%);mix-blend-mode:screen;transition:opacity .2s;animation:speedSpin 14s linear infinite}
    #grain{z-index:4;opacity:.11;background-image:radial-gradient(circle at 12% 17%,#fff 0 .5px,transparent .8px),radial-gradient(circle at 72% 63%,#fff 0 .45px,transparent .7px),radial-gradient(circle at 38% 82%,#fff 0 .55px,transparent .9px);background-size:7px 7px,9px 9px,11px 11px;mix-blend-mode:overlay;animation:grainShift .18s steps(2) infinite}
    #flash{z-index:9;opacity:0;background:#fff;mix-blend-mode:screen}
    #hud{position:fixed;inset:0;z-index:5;pointer-events:none;display:none;text-shadow:0 2px 6px #000}
    .top{position:absolute;left:2vw;right:2vw;top:2vh;display:flex;justify-content:space-between;align-items:flex-start;gap:2vw}
    .stack{min-width:260px}.label{font-size:clamp(11px,1vw,18px);letter-spacing:.15em;color:#b9c9dc;text-transform:uppercase}.big{font-size:clamp(25px,2.5vw,48px);font-weight:900;line-height:1}.right{text-align:right}
    .bar{width:min(32vw,480px);height:18px;margin-top:8px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);transform:skewX(-12deg);overflow:hidden}
    .fill{height:100%;width:100%;background:linear-gradient(90deg,#13becd,var(--cyan));box-shadow:0 0 18px var(--cyan);transition:width .12s}
    #ult-fill{background:linear-gradient(90deg,#8b1fff,var(--magenta));box-shadow:0 0 18px var(--magenta)}
    #boss-wrap{position:absolute;top:9.5vh;left:25%;right:25%;display:none;text-align:center}.bossbar{width:100%;height:20px;border:2px solid #ff85e4;background:#16061a;box-shadow:0 0 28px rgba(255,42,203,.35)}.bossbar .fill{background:linear-gradient(90deg,#d318a7,#ff4ed2)}
    #wave{position:absolute;left:50%;top:2vh;transform:translateX(-50%);padding:8px 25px;border:1px solid rgba(86,246,255,.52);background:linear-gradient(90deg,transparent,rgba(5,29,42,.82),transparent);font-size:clamp(14px,1.3vw,23px);font-weight:900;letter-spacing:.18em;color:var(--cyan);box-shadow:0 8px 35px rgba(86,246,255,.12)}
    #objective{position:absolute;top:17vh;left:50%;transform:translateX(-50%);font-size:clamp(17px,1.6vw,30px);font-weight:800;letter-spacing:.08em;text-align:center;color:#fff}
    #upgrade{position:absolute;left:2vw;bottom:3vh;font-size:clamp(14px,1.2vw,22px);color:var(--cyan);letter-spacing:.1em}
    #timer{position:absolute;right:2vw;bottom:3vh;font-size:clamp(18px,1.6vw,28px);font-weight:800}
    #combo{position:absolute;right:2vw;top:20vh;text-align:right;color:var(--orange);font-weight:900;font-size:clamp(25px,3vw,54px);opacity:0;transform:scale(.9);transition:.1s}
    #crosshair{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 5px var(--cyan))}
    #crosshair:before,#crosshair:after{content:"";position:absolute;background:var(--cyan)}#crosshair:before{left:15px;top:1px;width:3px;height:32px}#crosshair:after{left:1px;top:15px;width:32px;height:3px}
    #crosshair i{position:absolute;inset:10px;border:2px solid #fff;border-radius:50%}
    #screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:3vw;background:linear-gradient(90deg,rgba(2,2,8,.8),rgba(2,2,8,.22) 55%,rgba(2,2,8,.55));text-align:center}
    .panel{width:min(960px,94vw);padding:clamp(20px,4vw,60px);background:linear-gradient(135deg,rgba(7,10,26,.94),rgba(25,5,31,.84));border:1px solid rgba(96,244,255,.42);clip-path:polygon(3% 0,100% 0,100% 88%,97% 100%,0 100%,0 12%);box-shadow:0 0 70px rgba(255,42,203,.2)}
    h1{margin:0;font-size:clamp(58px,9vw,150px);line-height:.8;letter-spacing:-.06em;font-style:italic;text-transform:uppercase;background:linear-gradient(180deg,#fff 15%,var(--cyan) 55%,#1397b5);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(86,246,255,.5))}
    .tag{margin:22px 0 32px;color:#ff9ee8;font-size:clamp(14px,1.5vw,25px);font-weight:800;letter-spacing:.24em;text-transform:uppercase}
    .prompt{font-size:clamp(23px,2.5vw,43px);font-weight:900;animation:pulse 1s infinite alternate;color:#fff}.small{margin-top:24px;color:#b8c3d4;font-size:clamp(12px,1.1vw,18px);line-height:1.7}
    .keys{display:flex;justify-content:center;gap:16px 28px;flex-wrap:wrap;margin:25px auto 0}.keys span{color:#dbe7f4}.keys b{color:var(--cyan)}
    .scores{width:min(520px,90%);margin:20px auto;border-collapse:collapse;font-size:clamp(14px,1.3vw,22px)}.scores td{padding:5px 12px;border-bottom:1px solid rgba(255,255,255,.1)}.scores td:nth-child(2){color:var(--cyan);font-weight:900}.scores td:last-child{text-align:right;color:#ff9ee8}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.stat{padding:14px;background:rgba(255,255,255,.055);border-top:2px solid var(--cyan)}.stat b{display:block;font-size:clamp(19px,2vw,34px)}.stat span{font-size:12px;color:#aebbd0;letter-spacing:.1em}
    #initial-box{font-size:clamp(50px,7vw,110px);letter-spacing:.2em;font-weight:900;color:var(--cyan);margin:25px 0}.active-char{color:#fff;border-bottom:5px solid var(--magenta)}
    #toast{position:fixed;left:50%;top:31%;transform:translate(-50%,-50%) scale(.8);z-index:8;font-size:clamp(24px,4vw,68px);font-weight:1000;letter-spacing:.05em;text-align:center;text-shadow:0 0 15px #000;opacity:0;pointer-events:none;transition:.2s}
    #pause{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.75);font-size:8vw;font-weight:1000;letter-spacing:.1em}
    #settings{position:fixed;right:14px;bottom:12px;z-index:30;display:flex;gap:8px}.toggle{border:1px solid rgba(255,255,255,.25);background:rgba(4,5,12,.75);color:#bfc9d8;padding:8px 10px;font:700 11px inherit;letter-spacing:.08em;cursor:pointer}.toggle.on{color:var(--cyan);border-color:var(--cyan)}
    @keyframes pulse{from{opacity:.55;transform:scale(.99)}to{opacity:1;transform:scale(1.02)}}
    @keyframes speedSpin{to{transform:rotate(.5deg) scale(1.04)}}@keyframes grainShift{0%{transform:translate(0)}25%{transform:translate(-1%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(1%,1%)}}
    @media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.bar{width:42vw}.stack{min-width:0}.panel{padding:22px}.small{line-height:1.45}}
  </style>
</head>
<body>
  <div id="vignette"></div><div id="speed-fx"></div><div id="grain"></div><div id="flash"></div>
  <div id="hud">
    <div class="top">
      <div class="stack"><div class="label">Integrity</div><div class="bar"><div class="fill" id="health-fill"></div></div><div class="label" style="margin-top:12px">Overdrive</div><div class="bar"><div class="fill" id="ult-fill"></div></div></div>
      <div class="right"><div class="label">Score</div><div class="big" id="score">000000</div></div>
    </div>
    <div id="wave">WAVE 00 // STANDBY</div>
    <div id="boss-wrap"><div class="label">Apex Warden</div><div class="bossbar"><div class="fill" id="boss-fill"></div></div></div>
    <div id="objective">INITIALIZING WAVE PROTOCOL</div><div id="combo">×1.0<br><span class="label">COMBO</span></div>
    <div id="upgrade">WEAPON // STANDARD</div><div id="timer">00:00.0</div><div id="crosshair"><i></i></div>
  </div>
  <div id="toast"></div><div id="pause">PAUSED&nbsp; <span style="font-size:1.4vw;color:#56f6ff">ENTER / START TO RESUME</span></div>
  <div id="screen"><div class="panel" id="panel"></div></div>
  <div id="settings"><button class="toggle" id="mute">M // SOUND ON</button><button class="toggle" id="effects">V // FULL FX</button><button class="toggle" id="fullscreen">F // FULLSCREEN</button></div>

  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
    import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
    import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
    import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

    const INPUT_BINDINGS={
      move:{up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD']},
      aim:{up:['ArrowUp'],down:['ArrowDown'],left:['ArrowLeft'],right:['ArrowRight']},
      fire:['KeyZ'],dodge:['Space','KeyX','ShiftLeft','ShiftRight'],ultimate:['KeyQ','KeyE','KeyC'],
      start:['Enter'],pause:['Escape','KeyP'],mute:['KeyM'],effects:['KeyV'],fullscreen:['KeyF']
    };
    const STATE={ATTRACT:'ATTRACT',TUTORIAL:'TUTORIAL',ESCAPE:'ESCAPE',ARENA:'ARENA',ROUTE:'ROUTE',ROUTE_RUN:'ROUTE_RUN',FINAL:'FINAL',BOSS:'BOSS',EXTRACT:'EXTRACT',INITIALS:'INITIALS',RESULTS:'RESULTS'};
    const PLAY_STATES=new Set([STATE.TUTORIAL,STATE.ESCAPE,STATE.ARENA,STATE.ROUTE,STATE.ROUTE_RUN,STATE.FINAL,STATE.BOSS,STATE.EXTRACT]);
    const C={cyan:0x56f6ff,magenta:0xff2acb,orange:0xff8a27,red:0xff3158,dark:0x05030b,white:0xf4fbff};
    const $=s=>document.querySelector(s), clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
    const rand=(a,b)=>a+Math.random()*(b-a), choose=a=>a[(Math.random()*a.length)|0];

    class Input{
      constructor(){this.down=new Set();this.hit=new Set();this.mouse={x:0,y:0,down:false,hit:false,rightHit:false,active:false};this.aim={x:0,y:0};this.pad={moveX:0,moveY:0,aimX:0,aimY:0,fire:false};this.prevPad=[];
        addEventListener('keydown',e=>{if(!this.down.has(e.code))this.hit.add(e.code);this.down.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();});
        addEventListener('keyup',e=>this.down.delete(e.code));
        addEventListener('mousemove',e=>{this.mouse.x=e.clientX/innerWidth*2-1;this.mouse.y=1-e.clientY/innerHeight*2;this.mouse.active=true;});
        addEventListener('mousedown',e=>{if(e.button===0){this.mouse.down=true;this.mouse.hit=true;this.mouse.active=true;audio.ensure();}if(e.button===2){this.mouse.rightHit=true;audio.ensure();}});addEventListener('mouseup',e=>{if(e.button===0)this.mouse.down=false;});addEventListener('contextmenu',e=>e.preventDefault());
        addEventListener('blur',()=>{this.down.clear();this.mouse.down=false;});
      }
      any(arr){return arr.some(k=>this.down.has(k))} pressed(arr){return arr.some(k=>this.hit.has(k))}
      update(dt){let mx=(this.any(INPUT_BINDINGS.move.right)?1:0)-(this.any(INPUT_BINDINGS.move.left)?1:0),my=(this.any(INPUT_BINDINGS.move.down)?1:0)-(this.any(INPUT_BINDINGS.move.up)?1:0);
        let ax=(this.any(INPUT_BINDINGS.aim.right)?1:0)-(this.any(INPUT_BINDINGS.aim.left)?1:0),ay=(this.any(INPUT_BINDINGS.aim.up)?1:0)-(this.any(INPUT_BINDINGS.aim.down)?1:0);
        this.pollPad();if(Math.abs(this.pad.moveX)>.12)mx=this.pad.moveX;if(Math.abs(this.pad.moveY)>.12)my=this.pad.moveY;
        if(Math.abs(this.pad.aimX)>.16||Math.abs(this.pad.aimY)>.16){ax=this.pad.aimX;ay=-this.pad.aimY;this.mouse.active=false;}
        if(this.mouse.active){this.aim.x=lerp(this.aim.x,this.mouse.x,.22);this.aim.y=lerp(this.aim.y,this.mouse.y,.22);}else{this.aim.x=clamp(this.aim.x+ax*dt*1.5,-1,1);this.aim.y=clamp(this.aim.y+ay*dt*1.5,-.65,.85);}
        const l=Math.hypot(mx,my)||1;this.moveX=mx/l;this.moveY=my/l;this.fire=this.any(INPUT_BINDINGS.fire)||this.mouse.down||this.pad.fire;
      }
      pollPad(){const gp=navigator.getGamepads?.()[0];this.pad.startHit=false;this.pad.dodgeHit=false;this.pad.ultHit=false;if(!gp){this.pad.moveX=this.pad.moveY=this.pad.aimX=this.pad.aimY=0;this.pad.fire=false;return;}
        const dz=v=>Math.abs(v)<.14?0:v;this.pad.moveX=dz(gp.axes[0]||0);this.pad.moveY=dz(gp.axes[1]||0);this.pad.aimX=dz(gp.axes[2]||0);this.pad.aimY=dz(gp.axes[3]||0);this.pad.fire=(gp.buttons[7]?.value||0)>.25||gp.buttons[5]?.pressed;
        const map=[[9,'startHit'],[0,'dodgeHit'],[1,'ultHit']];for(const [i,n] of map){const v=!!gp.buttons[i]?.pressed;if(v&&!this.prevPad[i])this.pad[n]=true;this.prevPad[i]=v;}}
      edge(name){return this.pressed(INPUT_BINDINGS[name])||(name==='start'&&this.pad.startHit)||(name==='dodge'&&(this.pad.dodgeHit||this.mouse.rightHit))||(name==='ultimate'&&this.pad.ultHit)}
      end(){this.hit.clear();this.mouse.hit=false;this.mouse.rightHit=false}
    }

    class AudioSystem{
      constructor(){this.ctx=null;this.muted=false}
      ensure(){if(this.ctx){this.ctx.resume();return}try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch{}}
      tone(freq=300,dur=.08,type='sawtooth',gain=.04,slide=0){if(this.muted)return;this.ensure();if(!this.ctx)return;const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur)}
      noise(dur=.08,gain=.025,frequency=1200){if(this.muted)return;this.ensure();if(!this.ctx)return;const length=Math.max(1,this.ctx.sampleRate*dur|0),buffer=this.ctx.createBuffer(1,length,this.ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const src=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter(),g=this.ctx.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=frequency;filter.Q.value=.8;g.gain.setValueAtTime(gain,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+dur);src.connect(filter).connect(g).connect(this.ctx.destination);src.start();}
      shoot(){this.tone(160,.045,'square',.025,190);this.tone(730,.035,'sine',.018,-180);this.noise(.035,.014,2100)} hit(crit){this.tone(crit?980:510,crit?.12:.05,'triangle',crit?.055:.025,crit?420:90);if(crit)this.tone(1480,.08,'sine',.025,-220)} hurt(){this.tone(85,.24,'sawtooth',.07,-42);this.noise(.18,.035,260)} dodge(){this.tone(230,.17,'sine',.045,620);this.noise(.14,.018,1700)} boom(){this.tone(68,.44,'sawtooth',.085,-35);this.noise(.34,.075,180)} ui(){this.tone(620,.06,'square',.025,180);this.tone(980,.09,'sine',.014,-90)} ultimate(){this.tone(92,.9,'sawtooth',.09,980);this.tone(230,.65,'sine',.05,720);this.noise(.6,.04,520)}
    }
    const input=new Input(),audio=new AudioSystem();

    let scene,camera,renderer,composer,bloomPass,clock,game,world,player,fx;
    const mat=(color,emissive=color,ei=.2)=>new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:ei,roughness:.34,metalness:.72});
    const box=(w,h,d,m)=>{const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=x.receiveShadow=true;return x};
    const cyl=(r,h,m)=>{const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);x.castShadow=true;return x};
    const shaderClock={value:0};
    function energyMaterial(color=C.cyan,opacity=1){return new THREE.ShaderMaterial({transparent:opacity<1,depthWrite:opacity>=1,blending:opacity<1?THREE.AdditiveBlending:THREE.NormalBlending,uniforms:{uTime:shaderClock,uColor:{value:new THREE.Color(color)},uOpacity:{value:opacity}},vertexShader:`varying vec2 vUv;varying vec3 vNormalW;varying vec3 vView;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vNormalW=normalize(mat3(modelMatrix)*normal);vView=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uTime;uniform vec3 uColor;uniform float uOpacity;varying vec2 vUv;varying vec3 vNormalW;varying vec3 vView;void main(){float scan=.72+.28*sin(vUv.y*90.-uTime*12.);float fres=pow(1.-abs(dot(normalize(vNormalW),normalize(vView))),2.4);float pulse=.72+.28*sin(uTime*5.+vUv.x*18.);vec3 c=uColor*(.45+scan*.35+fres*1.8)*pulse;gl_FragColor=vec4(c,uOpacity*(.38+fres*.62));}`});}
    function floorMaterial(){return new THREE.ShaderMaterial({uniforms:{uTime:shaderClock,uSpeed:{value:0}},vertexShader:`varying vec3 vWorld;void main(){vec4 w=modelMatrix*vec4(position,1.);vWorld=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,fragmentShader:`uniform float uTime;uniform float uSpeed;varying vec3 vWorld;void main(){float gx=step(.94,fract(abs(vWorld.x)*.5));float gz=step(.965,fract((abs(vWorld.z)+uTime*uSpeed*.18)*.18));float lane=1.-smoothstep(.035,.09,abs(fract((vWorld.x+1.5)*.333)-.5));float pulse=.5+.5*sin(uTime*2.4-vWorld.z*.16);vec3 base=mix(vec3(.008,.018,.035),vec3(.015,.045,.07),pulse*.22);vec3 cyan=vec3(.12,.9,1.);vec3 mag=vec3(1.,.035,.62);vec3 c=base+cyan*(gx*.5+gz*.3)+mix(cyan,mag,pulse)*lane*.12;gl_FragColor=vec4(c,1.);}`});}

    class FXPool{
      constructor(){this.items=[];this.rings=[];this.beams=[];const geo=new THREE.TetrahedronGeometry(.1,0);for(let i=0;i<150;i++){const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:C.cyan,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));mesh.visible=false;scene.add(mesh);this.items.push({mesh,life:0,vel:new THREE.Vector3(),spin:new THREE.Vector3(),max:1});}for(let i=0;i<18;i++){const mesh=new THREE.Mesh(new THREE.RingGeometry(.4,.48,32),new THREE.MeshBasicMaterial({color:C.cyan,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));mesh.visible=false;scene.add(mesh);this.rings.push({mesh,life:0,max:1});}for(let i=0;i<24;i++){const geometry=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),mesh=new THREE.Line(geometry,new THREE.LineBasicMaterial({color:C.cyan,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));mesh.visible=false;scene.add(mesh);this.beams.push({mesh,life:0,max:1});}}
      burst(pos,color=C.cyan,count=8,power=5){if(game.reduced)count=Math.ceil(count*.4);for(let n=0;n<count;n++){const p=this.items.find(i=>i.life<=0);if(!p)break;p.life=p.max=rand(.22,.78);p.mesh.visible=true;p.mesh.position.copy(pos);p.mesh.scale.set(rand(.35,1.4),rand(.35,2.3),rand(.35,1.4));p.mesh.material.color.setHex(color);p.vel.set(rand(-1,1),rand(-.25,1.25),rand(-1,1)).normalize().multiplyScalar(rand(power*.4,power));p.spin.set(rand(-8,8),rand(-8,8),rand(-8,8));}if(count>=10&&!game.reduced){const r=this.rings.find(i=>i.life<=0);if(r){r.life=r.max=.55;r.mesh.visible=true;r.mesh.position.copy(pos);r.mesh.lookAt(camera.position);r.mesh.scale.setScalar(.6);r.mesh.material.color.setHex(color);}}}
      arc(a,b,color=C.cyan){const q=this.beams.find(x=>x.life<=0);if(!q)return;q.life=q.max=.11;q.mesh.visible=true;q.mesh.material.color.setHex(color);const mid=a.clone().lerp(b,.5).add(new THREE.Vector3(rand(-.25,.25),rand(-.25,.25),rand(-.25,.25))),arr=new Float32Array([a.x,a.y,a.z,mid.x,mid.y,mid.z,b.x,b.y,b.z]);q.mesh.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3));q.mesh.geometry.computeBoundingSphere();}
      update(dt){for(const p of this.items)if(p.life>0){p.life-=dt;p.vel.y-=5*dt;p.mesh.position.addScaledVector(p.vel,dt);p.mesh.rotation.x+=p.spin.x*dt;p.mesh.rotation.y+=p.spin.y*dt;p.mesh.rotation.z+=p.spin.z*dt;p.mesh.scale.multiplyScalar(.965);p.mesh.material.opacity=clamp(p.life/p.max,0,1);if(p.life<=0)p.mesh.visible=false;}for(const r of this.rings)if(r.life>0){r.life-=dt;r.mesh.scale.multiplyScalar(1+dt*7);r.mesh.material.opacity=clamp(r.life/r.max,0,1)*.65;if(r.life<=0)r.mesh.visible=false;}for(const b of this.beams)if(b.life>0){b.life-=dt;b.mesh.material.opacity=clamp(b.life/b.max,0,1);if(b.life<=0)b.mesh.visible=false;}}

    class World{

      updateInitials(dt){this.stateTime+=dt;this.initialCooldown-=dt;let changed=false;if(this.initialCooldown<=0){if(input.edge('start')){if(this.initialPos<2)this.initialPos++;else{this.highScores.push({name:this.initials.join(''),score:Math.round(this.score)});this.highScores.sort((a,b)=>b.score-a.score);this.highScores=this.highScores.slice(0,10);this.saveScores();audio.ui();this.showResults();input.end();return;}}const up=input.pressed(['ArrowUp'])||(input.pad.aimY<-.6),down=input.pressed(['ArrowDown'])||(input.pad.aimY>.6),left=input.pressed(['ArrowLeft'])||(input.pad.aimX<-.6),right=input.pressed(['ArrowRight'])||(input.pad.aimX>.6);if(up||down){let n=this.initials[this.initialPos].charCodeAt(0)+(up?1:-1);if(n>90)n=65;if(n<65)n=90;this.initials[this.initialPos]=String.fromCharCode(n);changed=true;}if(left||right){this.initialPos=clamp(this.initialPos+(right?1:-1),0,2);changed=true;}if(changed){this.initialCooldown=.17;audio.ui();this.renderInitials();}}
      }
      showResults(){this.state=STATE.RESULTS;this.stateTime=0;$('#screen').style.display='flex';const rows=this.highScores.slice(0,5).map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+s.name+'</td><td>'+s.score.toLocaleString()+'</td></tr>').join('');$('#panel').innerHTML='<div class="tag">'+(this.won?'WAVE PROTOCOL CLEARED':'RUN TERMINATED')+'</div><div class="prompt">GRADE '+this.grade+' // '+Math.round(this.score).toLocaleString()+'</div><div class="stats"><div class="stat"><b>'+this.accuracy.toFixed(1)+'%</b><span>ACCURACY</span></div><div class="stat"><b>×'+(1+Math.min(4,this.maxCombo*.08)).toFixed(1)+'</b><span>MAX COMBO</span></div><div class="stat"><b>'+formatTime(this.runTime)+'</b><span>TIME</span></div><div class="stat"><b>'+Math.round(this.damageTaken)+'</b><span>DAMAGE</span></div><div class="stat"><b>'+this.route+'</b><span>ROUTE</span></div><div class="stat"><b>'+this.wave+'</b><span>WAVES</span></div></div><table class="scores">'+rows+'</table><div class="prompt">ENTER / CLICK / START TO RUN AGAIN</div><div class="small">Returns to attract mode in 30 seconds</div>';}
      showAttract(){for(const e of [...this.enemies])e.destroy(false);for(const b of [...this.playerBullets,...this.enemyBullets])this.removeBullet(b);if(this.boss){this.boss.destroy();this.boss=null;}world.clearDynamic();this.state=STATE.ATTRACT;this.stateTime=0;this.paused=false;player.group.visible=true;player.group.position.set(0,0,2);$('#pause').style.display='none';$('#hud').style.display='none';$('#screen').style.display='flex';const rows=this.highScores.slice(0,5).map((s,i)=>'<tr><td>'+(i+1)+'</td><td>'+s.name+'</td><td>'+s.score.toLocaleString()+'</td></tr>').join('');$('#panel').innerHTML='<h1>Rift<br>Runner</h1><div class="tag">Wave Protocol // Survive. Accelerate. Dominate.</div><div class="prompt">PRESS ENTER / CLICK / START</div><div class="keys"><span><b>WASD</b> MOVE</span><span><b>MOUSE</b> AIM</span><span><b>LEFT CLICK</b> FIRE</span><span><b>SPACE</b> DODGE</span><span><b>Q / E</b> OVERDRIVE</span></div><table class="scores">'+rows+'</table><div class="small">GAMEPAD: LS MOVE · RS AIM · RT FIRE · A DODGE · B OVERDRIVE<br>ARCADE: ARROWS AIM · Z FIRE · X DODGE · C OVERDRIVE &nbsp; // &nbsp; F FULLSCREEN · M MUTE · V FX</div>';}
      togglePause(){this.paused=!this.paused;$('#pause').style.display=this.paused?'flex':'none';if(!this.paused)clock.getDelta();}
    }

    function formatTime(s){const m=Math.floor(s/60),sec=s-m*60;return String(m).padStart(2,'0')+':'+sec.toFixed(1).padStart(4,'0')}
    function init(){scene=new THREE.Scene();scene.background=new THREE.Color(C.dark);scene.fog=new THREE.FogExp2(0x050713,.018);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,240);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',stencil:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0x5d8cff,0x120517,1.45));const sun=new THREE.DirectionalLight(0xc6f4ff,3.2);sun.position.set(5,11,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;sun.shadow.bias=-.0004;scene.add(sun);const mag=new THREE.PointLight(C.magenta,55,55,2);mag.position.set(-12,7,-35);scene.add(mag);const cyan=new THREE.PointLight(C.cyan,40,60,2);cyan.position.set(10,6,-55);scene.add(cyan);const key=new THREE.SpotLight(0xffffff,110,90,.5,.7,1.4);key.position.set(0,16,-12);key.target.position.set(0,0,-35);scene.add(key,key.target);
      composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.95,.42,.28);composer.addPass(bloomPass);composer.addPass(new OutputPass());
      clock=new THREE.Clock();world=new World();player=new Player();fx=new FXPool();game=new Game();applyToggles();addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&PLAY_STATES.has(game.state)&&!game.paused)game.togglePause()});loop();}
    function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));composer.setSize(innerWidth,innerHeight);}
    function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());shaderClock.value+=dt;game.update(dt);bloomPass.strength=game.reduced ? .35 : .95+Math.min(game.combo||0,20)*.004;composer.render();}
    function toggleMute(){game.muted=!game.muted;audio.muted=game.muted;try{localStorage.setItem('rrMuted',game.muted?'1':'0')}catch{}applyToggles();}
    function toggleEffects(){game.reduced=!game.reduced;try{localStorage.setItem('rrReduced',game.reduced?'1':'0')}catch{}applyToggles();}
    function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
    function applyToggles(){if(!game)return;$('#mute').textContent='M // SOUND '+(game.muted?'OFF':'ON');$('#mute').classList.toggle('on',!game.muted);$('#effects').textContent='V // '+(game.reduced?'REDUCED FX':'FULL FX');$('#effects').classList.toggle('on',!game.reduced);if(bloomPass)bloomPass.strength=game.reduced ? .35 : .95;$('#grain').style.display=game.reduced?'none':'block';}
    $('#settings').addEventListener('mousedown',e=>e.stopPropagation());$('#mute').addEventListener('click',()=>{audio.ensure();toggleMute()});$('#effects').addEventListener('click',toggleEffects);$('#fullscreen').addEventListener('click',toggleFullscreen);
    try{init()}catch(err){console.error(err);$('#panel').innerHTML='<div class="prompt">WAVE SYSTEM ERROR</div><div class="small">WebGL could not start. Update the browser or enable hardware acceleration.</div>';}
  </script>
</body>
</html>
