<html lang="en">
<head>

<style>

px,7vw,88px);line-height:.82;letter-spacing:-.065em;text-transform:uppercase;font-style:italic}.featured-meta{margin:16px 0 10px;color:#c2ccda;font-size:12px;font-weight:800;letter-spacing:.055em;text-transform:uppercase}.desc{max-width:500px;margin:0 0 21px;color:#c2ccda;font-size:17px}.play{display:inline-flex;gap:13px;align-items:center;padding:14px 20px;border-radius:10px;background:#f7fbff;color:#061018;text-decoration:none;font-weight:900;transition:.18s}.play:after{content:"→"}.play:hover{background:var(--cyan);transform:translateY(-2px)}.browse-head{margin:52px 0 17px;display:flex;align-items:end;justify-content:space-between;gap:20px}.browse-head h3{margin:5px 0 0;font-size:34px;line-height:1;letter-spacing:-.045em}.sub{margin-top:7px;color:var(--muted);font-size:12px}.search-wrap{display:none}.search{width:340px;max-width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#090e18;color:var(--text);outline:none}.play:focus-visible,.card:focus-visible,.search:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:76px}.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);text-decoration:none;transition:.2s}.card:hover{transform:translateY(-4px);border-color:rgba(100,239,255,.36);box-shadow:0 18px 48px rgba(0,0,0,.28)}.card-media{position:relative;aspect-ratio:16/9;overflow:hidden;background:#090e18}.card-media img{width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;background:radial-gradient(circle at 78% 16%,rgba(232,91,255,.22),transparent 32%),radial-gradient(circle at 12% 85%,rgba(100,239,255,.2),transparent 35%),repeating-linear-gradient(125deg,transparent 0 31px,rgba(100,239,255,.035) 32px 33px),#080d17}.fallback span{font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#a9b8cc}.body{display:flex;flex:1;flex-direction:column;min-height:148px;padding:15px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 9px}.chip{padding:3px 7px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:transparent;color:#c2ccda;font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.title{font-size:21px;font-weight:900;line-height:1.05;letter-spacing:-.035em}.card-desc{margin-top:6px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-play{margin-top:auto;padding-top:15px;color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.empty{grid-column:1/-1;padding:42px;border:1px dashed var(--line);border-radius:15px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);padding:24px 0 36px;color:#6f7f96;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}@media(max-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{width:calc(100% - 28px)}.nav-note{display:none}.featured{min-height:510px}.copy{left:21px;right:21px;bottom:24px;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.browse-head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:500px){.labs{display:none}.featured{min-height:485px}.copy h2{font-size:48px}.desc{font-size:14px}.grid{grid-template-columns:1fr}.browse-head{margin-top:40px}footer{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){.card,.play{transition:none}}
.featured-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:28px 0 11px}.featured-head .kicker{margin:0}.featured-controls{display:none;align-items:center;gap:8px}.featured-count{min-width:48px;color:#8797ae;font-size:10px;font-weight:900;letter-spacing:.12em;text-align:center}.featured-button{min-width:62px;padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#090e18;color:#c7d2e1;font:inherit;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.18s}.featured-button:hover{border-color:rgba(100,239,255,.5);color:var(--cyan)}.featured-button:focus-visible,.featured-dot:focus-visible,.featured-viewport:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.featured-viewport{display:flex;gap:18px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-inline:contain;padding:0 clamp(42px,8vw,112px) 10px 0}.featured-viewport::-webkit-scrollbar{display:none}.featured-viewport .empty{flex:1}.featured-slide{flex:0 0 calc(100% - clamp(42px,8vw,112px));scroll-snap-align:start;scroll-snap-stop:always}.featured-slide[aria-hidden="true"] .copy{opacity:.76}.featured-pagination{display:flex;align-items:center;gap:7px;margin-top:15px}.featured-dot{width:24px;height:4px;padding:0;border:0;border-radius:999px;background:#293348;cursor:pointer;transition:width .18s,background .18s}.featured-dot[aria-current="true"]{width:48px;background:var(--cyan)}.slide-number{position:absolute;z-index:2;right:24px;top:21px;color:rgba(236,244,255,.58);font-size:10px;font-weight:900;letter-spacing:.16em}.featured-slide .copy h2{font-size:clamp(46px,6.5vw,82px)}
@media(max-width:760px){.featured-head{margin-top:22px}.featured-controls{gap:5px}.featured-count{display:none}.featured-button{min-width:51px;padding:7px 8px}.featured-viewport{gap:12px;padding-right:28px}.featured-slide{flex-basis:calc(100% - 28px)}.featured-pagination{margin-top:10px}.featured-dot{flex:1;max-width:38px}.featured-dot[aria-current="true"]{width:38px}.slide-number{right:18px;top:16px}.featured-slide .copy h2{font-size:clamp(40px,12vw,58px)}}
@media(prefers-reduced-motion:reduce){.featured-viewport{scroll-behavior:auto}.featured-button,.featured-dot{transition:none}}
.featured-viewport{position:relative}
.featured-slide[aria-current="false"] .copy{opacity:.76}
</style>
</head>
<body><div class="shell"><nav class="nav"><a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Nexus Arcade <span class="labs">Luminary Labs</span></a><span class="nav-note">Playable experiments</span></nav><main><div class="featured-head"><div class="kicker">Featured</div><div id="featured-controls" class="featured-controls"><button id="featured-prev" class="featured-button" type="button">Previous</button><span id="featured-count" class="featured-count" aria-live="polite">01 / 05</span><button id="featured-next" class="featured-button" type="button">Next</button></div></div><section id="featured" class="featured-viewport" tabindex="0" aria-label="Featured games"></section><div id="featured-pagination" class="featured-pagination" aria-label="Choose featured game"></div><div id="browse-head" class="browse-head"><div><div class="eyebrow">Library</div><h3>Browse prototypes</h3><div id="sub" class="sub">Loading playable builds…</div></div><div id="search-wrap" class="search-wrap"><input id="search" class="search" type="search" placeholder="Search games…" aria-label="Search games"></div></div><section id="grid" class="grid" aria-live="polite"></section></main><footer><span>Nexus Arcade · Luminary Labs</span><span>Play · Test · Build</span></footer></div>
<script>
const featured=document.querySelector('#featured'),featuredControls=document.querySelector('#featured-controls'),featuredPrev=document.querySelector('#featured-prev'),featuredNext=document.querySelector('#featured-next'),featuredCount=document.querySelector('#featured-count'),featuredPagination=document.querySelector('#featured-pagination'),browseHead=document.querySelector('#browse-head'),grid=document.querySelector('#grid'),search=document.querySelector('#search'),searchWrap=document.querySelector('#search-wrap'),sub=document.querySelector('#sub');let games=[],featuredGames=[],activeFeatured=0,scrollFrame=0;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n},label=v=>String(v||'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),chip=v=>el('span','chip',v);
function media(game,isFeature=false){const m=el('div',isFeature?'media':'card-media');if(game.thumbnail){const img=document.createElement('img');img.src=game.thumbnail;img.alt=`${game.title} gameplay`;img.loading=isFeature?'eager':'lazy';m.append(img)}else{const x=el('div','fallback');x.append(el('span','',`Nexus // ${game.slug}`));m.append(x)}return m}
function setFeatured(index,move=false){if(!featuredGames.length)return;activeFeatured=(index+featuredGames.length)%featuredGames.length;const slides=[...featured.querySelectorAll('.featured-slide')],dots=[...featuredPagination.querySelectorAll('.featured-dot')];slides.forEach((slide,i)=>slide.setAttribute('aria-current',String(i===activeFeatured)));dots.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===activeFeatured)));featuredCount.textContent=`${String(activeFeatured+1).padStart(2,'0')} / ${String(featuredGames.length).padStart(2,'0')}`;if(move){const slide=slides[activeFeatured];if(slide)featured.scrollTo({left:slide.offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
function renderFeatured(list){featured.replaceChildren();featuredPagination.replaceChildren();featuredGames=list.slice(0,5);if(!featuredGames.length){featured.append(el('div','empty','No playable prototypes yet.'));featuredControls.style.display='none';return}for(const [i,game] of featuredGames.entries()){const a=el('article','featured featured-slide');a.dataset.index=i;a.append(media(game,true),el('span','slide-number',`${String(i+1).padStart(2,'0')} / ${String(featuredGames.length).padStart(2,'0')}`));const c=el('div','copy');c.append(el('h2','',game.title),el('div','featured-meta',`${game.genre} · ${label(game.status)} ${game.version}`),el('p','desc',game.description||'Playable Nexus Arcade experiment.'));const p=el('a','play','Play now');p.href=game.launchUrl;p.setAttribute('aria-label',`Play ${game.title}`);c.append(p);a.append(c);featured.append(a);const dot=el('button','featured-dot');dot.type='button';dot.setAttribute('aria-label',`Show ${game.title}`);dot.addEventListener('click',()=>setFeatured(i,true));featuredPagination.append(dot)}featuredControls.style.display=featuredGames.length>1?'flex':'none';featuredPagination.style.display=featuredGames.length>1?'flex':'none';setFeatured(0)}
function renderCards(q=''){q=q.trim().toLowerCase();const list=games.filter(g=>[g.title,g.description,g.genre,g.status,g.slug,...(g.controls||[])].join(' ').toLowerCase().includes(q));grid.replaceChildren();sub.textContent=q?`${list.length} matching game${list.length===1?'':'s'}`:`${games.length} playable ${games.length===1?'prototype':'prototypes'}`;if(!list.length){grid.append(el('div','empty',games.length?'No games match that search.':'More experiments are on the way.'));return}for(const g of list){const a=el('a','card');a.href=g.launchUrl;a.setAttribute('aria-label',`Play ${g.title}`);a.append(media(g));const b=el('div','body'),meta=el('div','meta');[g.genre,g.version].forEach(v=>meta.append(chip(v)));b.append(meta,el('div','title',g.title),el('div','card-desc',g.description||g.slug),el('div','card-play','Play →'));a.append(b);grid.append(a)}}
featuredPrev.addEventListener('click',()=>setFeatured(activeFeatured-1,true));featuredNext.addEventListener('click',()=>setFeatured(activeFeatured+1,true));featured.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();setFeatured(activeFeatured-1,true)}else if(event.key==='ArrowRight'){event.preventDefault();setFeatured(activeFeatured+1,true)}else if(event.key==='Home'){event.preventDefault();setFeatured(0,true)}else if(event.key==='End'){event.preventDefault();setFeatured(featuredGames.length-1,true)}});featured.addEventListener('scroll',()=>{cancelAnimationFrame(scrollFrame);scrollFrame=requestAnimationFrame(()=>{const slides=[...featured.querySelectorAll('.featured-slide')];if(!slides.length)return;const nearest=slides.reduce((best,slide,i)=>Math.abs(slide.offsetLeft-featured.scrollLeft)<best.distance?{index:i,distance:Math.abs(slide.offsetLeft-featured.scrollLeft)}:best,{index:0,distance:Infinity});if(nearest.index!==activeFeatured)setFeatured(nearest.index)})},{passive:true});search.addEventListener('input',()=>renderCards(search.value));fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{games=Array.isArray(d.games)?d.games:[];renderFeatured(games);const showBrowse=games.length>1;browseHead.style.display=showBrowse?'flex':'none';grid.style.display=showBrowse?'grid':'none';if(showBrowse)renderCards();searchWrap.style.display=showBrowse&&games.length>=6?'block':'none'}).catch(e=>{featured.replaceChildren(el('div','empty','The arcade is temporarily unavailable.'));featuredControls.style.display='none';featuredPagination.style.display='none';browseHead.style.display='none';grid.style.display='none'});
</script></body></html>
