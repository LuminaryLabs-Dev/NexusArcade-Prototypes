<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070d">
<title>Nexus Arcade — Luminary Labs</title>
<style>
:root{color-scheme:dark;--bg:#05070d;--panel:#0b101c;--line:rgba(160,180,215,.18);--text:#f7f9fd;--muted:#96a5bc;--cyan:#64efff;--mag:#e85bff}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 78% 0,rgba(140,92,255,.13),transparent 30%),radial-gradient(circle at 15% 4%,rgba(80,230,255,.08),transparent 25%),linear-gradient(#080b13,#05070d 50%,#04060a)}a{color:inherit}.shell{width:min(1280px,calc(100% - 44px));margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:20px;font-weight:900;letter-spacing:-.04em}.mark{width:25px;height:25px;border:2px solid var(--cyan);border-radius:4px;transform:rotate(45deg);box-shadow:inset 0 0 0 6px #090d17,0 0 18px rgba(100,239,255,.1)}.labs,.nav-note{color:#8797ae;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero-head{padding:46px 0 22px;display:flex;justify-content:space-between;align-items:end;gap:32px}.eyebrow,.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.19em;text-transform:uppercase}.hero-head h1{margin:8px 0 0;font-size:clamp(43px,6.4vw,82px);line-height:.9;letter-spacing:-.065em}.hero-head p{max-width:410px;margin:0 0 5px;color:var(--muted);font-size:17px}.kicker{display:flex;align-items:center;gap:9px;margin:18px 0 11px;color:#b5c2d4}.kicker:before{content:"";width:22px;height:1px;background:var(--cyan)}.featured{position:relative;min-height:540px;overflow:hidden;border:1px solid rgba(160,180,215,.27);border-radius:22px;background:#080c14;box-shadow:0 28px 85px rgba(0,0,0,.38);isolation:isolate}.media{position:absolute;inset:0;background:#090e18}.media img,.media iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}.media iframe{pointer-events:none;transform:scale(1.01);background:#05030b}.featured .media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,10,.95),rgba(3,5,10,.66) 38%,rgba(3,5,10,.18) 70%),linear-gradient(0deg,rgba(3,5,10,.72),transparent 48%)}.copy{position:absolute;z-index:2;left:clamp(24px,5vw,66px);bottom:clamp(27px,5vw,60px);width:min(540px,74%)}.copy h2{margin:8px 0 0;font-size:clamp(48px,7vw,88px);line-height:.82;letter-spacing:-.065em;text-transform:uppercase;font-style:italic}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 12px}.chip{padding:4px 9px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(5,8,15,.54);color:#c2ccda;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.desc{max-width:500px;margin:0 0 21px;color:#c2ccda;font-size:17px}.play{display:inline-flex;gap:13px;align-items:center;padding:14px 20px;border-radius:10px;background:#f7fbff;color:#061018;text-decoration:none;font-weight:900;transition:.18s}.play:after{content:"→"}.play:hover{background:var(--cyan);transform:translateY(-2px)}.live{position:absolute;z-index:3;right:16px;top:16px;padding:7px 10px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(3,6,12,.72);color:#bcc8d8;font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.browse-head{margin:52px 0 17px;display:flex;align-items:end;justify-content:space-between;gap:20px}.browse-head h3{margin:5px 0 0;font-size:34px;line-height:1;letter-spacing:-.045em}.sub{margin-top:7px;color:var(--muted);font-size:12px}.search-wrap{display:none}.search{width:340px;max-width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#090e18;color:var(--text);outline:none}.play:focus-visible,.card:focus-visible,.search:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:76px}.card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);text-decoration:none;transition:.2s}.card:hover{transform:translateY(-4px);border-color:rgba(100,239,255,.36);box-shadow:0 18px 48px rgba(0,0,0,.28)}.card-media{position:relative;aspect-ratio:16/9;overflow:hidden;background:#090e18}.card-media img{width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;background:radial-gradient(circle at 78% 16%,rgba(232,91,255,.22),transparent 32%),radial-gradient(circle at 12% 85%,rgba(100,239,255,.2),transparent 35%),repeating-linear-gradient(125deg,transparent 0 31px,rgba(100,239,255,.035) 32px 33px),#080d17}.fallback span{font-size:9px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#a9b8cc}.body{display:flex;flex:1;flex-direction:column;min-height:148px;padding:15px}.card .meta{margin:0 0 9px}.card .chip{padding:3px 7px;font-size:8px;background:transparent}.title{font-size:21px;font-weight:900;line-height:1.05;letter-spacing:-.035em}.card-desc{margin-top:6px;color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-play{margin-top:auto;padding-top:15px;color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.empty{grid-column:1/-1;padding:42px;border:1px dashed var(--line);border-radius:15px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);padding:24px 0 36px;color:#6f7f96;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}@media(max-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{width:calc(100% - 28px)}.nav-note{display:none}.hero-head{display:block;padding-top:34px}.hero-head p{margin-top:15px}.featured{min-height:510px}.featured .media:after{background:linear-gradient(0deg,rgba(3,5,10,.95),rgba(3,5,10,.62) 52%,rgba(3,5,10,.12))}.copy{left:21px;right:21px;bottom:24px;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.browse-head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:500px){.labs{display:none}.hero-head h1{font-size:45px}.featured{min-height:485px}.copy h2{font-size:48px}.desc{font-size:14px}.grid{grid-template-columns:1fr}.browse-head{margin-top:40px}footer{flex-direction:column;gap:8px}}@media(prefers-reduced-motion:reduce){.card,.play{transition:none}}
</style>
</head>
<body><div class="shell"><nav class="nav"><a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Nexus Arcade <span class="labs">Luminary Labs</span></a><span class="nav-note">Playable experiments</span></nav><main><header class="hero-head"><div><div class="eyebrow">Luminary Labs</div><h1>Play what we're building.</h1></div><p>Experimental games, playable early. Pick one up, run it, and see where it can go.</p></header><div class="kicker">Featured</div><section id="featured" aria-live="polite"></section><div class="browse-head"><div><div class="eyebrow">Library</div><h3>Browse prototypes</h3><div id="sub" class="sub">Loading playable builds…</div></div><div id="search-wrap" class="search-wrap"><input id="search" class="search" type="search" placeholder="Search games…" aria-label="Search games"></div></div><section id="grid" class="grid" aria-live="polite"></section></main><footer><span>Nexus Arcade · Luminary Labs</span><span>Play · Test · Build</span></footer></div>
<script>
const featured=document.querySelector('#featured'),grid=document.querySelector('#grid'),search=document.querySelector('#search'),searchWrap=document.querySelector('#search-wrap'),sub=document.querySelector('#sub');let games=[];
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n},label=v=>String(v||'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),chip=v=>el('span','chip',v);
function media(game,isFeature=false){const m=el('div',isFeature?'media':'card-media');if(game.thumbnail){const img=document.createElement('img');img.src=game.thumbnail;img.alt=`${game.title} gameplay`;img.loading=isFeature?'eager':'lazy';m.append(img)}else if(isFeature){const f=document.createElement('iframe');f.src=game.launchUrl;f.title=`${game.title} live gameplay preview`;f.tabIndex=-1;f.setAttribute('aria-hidden','true');f.addEventListener('load',()=>setTimeout(()=>{try{f.contentWindow.dispatchEvent(new KeyboardEvent('keydown',{code:'Enter',key:'Enter'}));setTimeout(()=>f.contentWindow.dispatchEvent(new KeyboardEvent('keyup',{code:'Enter',key:'Enter'})),80)}catch{}},700));m.append(f)}else{const x=el('div','fallback');x.append(el('span','',`Nexus // ${game.slug}`));m.append(x)}return m}
function renderFeatured(game){featured.replaceChildren();if(!game){featured.append(el('div','empty','No playable prototypes yet.'));return}const a=el('article','featured');a.append(media(game,true));if(!game.thumbnail)a.append(el('div','live','Live gameplay'));const c=el('div','copy');c.append(el('div','eyebrow','Featured prototype'),el('h2','',game.title));const meta=el('div','meta');[game.genre,`${label(game.status)} ${game.version}`].forEach(v=>meta.append(chip(v)));c.append(meta,el('p','desc',game.description||'Playable Nexus Arcade experiment.'));const p=el('a','play','Play now');p.href=game.launchUrl;p.setAttribute('aria-label',`Play ${game.title}`);c.append(p);a.append(c);featured.append(a)}
function renderCards(q=''){q=q.trim().toLowerCase();const list=games.filter(g=>[g.title,g.description,g.genre,g.status,g.slug,...(g.controls||[])].join(' ').toLowerCase().includes(q));grid.replaceChildren();sub.textContent=q?`${list.length} matching game${list.length===1?'':'s'}`:`${games.length} playable ${games.length===1?'prototype':'prototypes'}`;if(!list.length){grid.append(el('div','empty',games.length?'No games match that search.':'More experiments are on the way.'));return}for(const g of list){const a=el('a','card');a.href=g.launchUrl;a.setAttribute('aria-label',`Play ${g.title}`);a.append(media(g));const b=el('div','body'),meta=el('div','meta');[g.genre,g.version].forEach(v=>meta.append(chip(v)));b.append(meta,el('div','title',g.title),el('div','card-desc',g.description||g.slug),el('div','card-play','Play →'));a.append(b);grid.append(a)}}
search.addEventListener('input',()=>renderCards(search.value));fetch('./catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(d=>{games=Array.isArray(d.games)?d.games:[];renderFeatured(games.find(g=>g.featured)||games[0]);renderCards();searchWrap.style.display=games.length>=6?'block':'none'}).catch(e=>{featured.replaceChildren(el('div','empty','The arcade is temporarily unavailable.'));sub.textContent=`Catalog unavailable · ${e.message}`});
</script></body></html>
